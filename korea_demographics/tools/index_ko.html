<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Pretendard;font-weight:400;src:url(Pretendard-Regular.otf)}
@font-face{font-family:Pretendard;font-weight:500;src:url(Pretendard-Medium.otf)}
@font-face{font-family:Pretendard;font-weight:600;src:url(Pretendard-SemiBold.otf)}
@font-face{font-family:Pretendard;font-weight:700;src:url(Pretendard-Bold.otf)}
@font-face{font-family:Pretendard;font-weight:800;src:url(Pretendard-ExtraBold.otf)}
@font-face{font-family:Pretendard;font-weight:900;src:url(Pretendard-Black.otf)}
html,body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="data.js"></script><script src="clips/info.js"></script><script src="lib.js"></script><script src="kit.js"></script><script src="scenes_ko.js"></script><script src="main_ko.js"></script>
<script>
(async()=>{
  await Promise.all([400,500,600,700,800,900].map(w=>document.fonts.load(`${w} 40px Pretendard`,'가A')));
  setCtx(document.getElementById('c').getContext('2d')); initMap();
  window.frameJpeg = async (t, q) => { await preloadFrames(t); render(t); return document.getElementById('c').toDataURL('image/jpeg', q || 0.92); };
  window.ready = true;
})();
</script></body></html>
